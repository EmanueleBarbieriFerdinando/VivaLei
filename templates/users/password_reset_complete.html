{% extends "base.html" %}
{% block title %}Password aggiornata | VivaLei{% endblock %}
{% block extra_css %}
<style>
    .auth-page { min-height: calc(100vh - 180px); display: flex; align-items: center; padding: 55px 0 75px; background: radial-gradient(circle at 10% 15%, rgba(134, 22, 125, .045), transparent 28%), #fcfbfa; }
    .auth-wrapper { width: 100%; max-width: 520px; margin: 0 auto; }
    .auth-intro { margin-bottom: 28px; text-align: center; }
    .auth-eyebrow { margin-bottom: 9px; color: var(--vivalei-purple); font-size: 14px; font-weight: 700; letter-spacing: .05em; }
    .auth-title { margin-bottom: 10px; font-size: clamp(38px, 5vw, 48px); font-weight: 500; }
    .auth-subtitle { margin: 0; color: var(--vivalei-text-muted); font-size: 17px; line-height: 1.6; }
    .auth-card { padding: 34px; background: #fff; border: 1px solid var(--vivalei-border); border-radius: 22px; }
    .auth-submit { width: 100%; min-height: 56px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 13px; background: var(--vivalei-purple); color: #fff; font-size: 16px; font-weight: 700; transition: .2s ease; }
    .auth-submit:hover { background: var(--vivalei-purple-dark); }
    @media (max-width: 575.98px) { .auth-page { align-items: flex-start; padding: 34px 0 55px; } .auth-card { padding: 25px 20px; border-radius: 18px; } }
</style>
{% endblock %}
{% block content %}
<section class="auth-page"><div class="container"><div class="auth-wrapper"><div class="auth-intro"><div class="auth-eyebrow">TUTTO PRONTO</div><h1 class="auth-title">Password aggiornata</h1><p class="auth-subtitle">Ora puoi accedere con la tua nuova password.</p></div><div class="auth-card"><a href="{% url 'users:login' %}" class="auth-submit">Accedi</a></div></div></div></section>
{% endblock %}
