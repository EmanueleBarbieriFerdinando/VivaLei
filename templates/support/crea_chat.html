{% extends "base.html" %}


{% block title %}
Contattaci
{% endblock %}



{% block content %}

<div class="container py-5">


    <div class="row justify-content-center">


        <div class="col-lg-8">


            <div class="card shadow-sm">


                <div class="card-body p-4">


                    <h1 class="text-vivalei mb-4">
                        Contattaci
                    </h1>


                    <p class="text-muted">
                        Scrivici la tua richiesta. Il nostro servizio clienti ti risponderà il prima possibile.
                    </p>



                    <form
                        method="post"
                        enctype="multipart/form-data"
                    >

                        {% csrf_token %}



                        <div class="mb-3">

                            <label class="form-label">
                                Categoria
                            </label>

                            {{ form.categoria }}

                        </div>



                        <div class="mb-3">

                            <label class="form-label">
                                Oggetto
                            </label>

                            {{ form.oggetto }}

                        </div>



                        <div class="mb-3">

                            <label class="form-label">
                                Messaggio
                            </label>

                            {{ form.messaggio }}

                        </div>



                        <div class="mb-3">

                            <label class="form-label">
                                Allegati
                            </label>


                            <input
                                type="file"
                                name="allegati"
                                multiple
                                class="form-control"
                            >

                        </div>



                        <button
                            class="btn btn-vivalei"
                        >

                            Invia richiesta

                        </button>



                    </form>


                </div>


            </div>


        </div>


    </div>


</div>


{% endblock %}
